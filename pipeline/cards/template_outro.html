<!doctype html>
<html><head><meta charset="utf-8">
<style>
@import url('_shared.css');
.top-row{ display:flex; justify-content:space-between; align-items:center; }
.center-block{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:28px; }

h2{
  font-family:'Nanum Myeongjo', serif;
  font-weight:800;
  font-size:60px;
  line-height:1.28;
  letter-spacing:-0.015em;
  max-width:740px;
  margin:0 auto;
  word-break:keep-all;
}
h2 .accent{ color:var(--amber); }
.cta{ font-size:26px; color:var(--muted); max-width:700px; margin:0 auto; line-height:1.6; word-break:keep-all; }

.ask{
  display:flex; flex-direction:column; gap:12px;
  width:100%;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-top:5px solid var(--teal);
  border-radius:14px;
  align-items:center;
  padding:26px 30px;
}
.ask .ask-label{
  font-family:'IBM Plex Mono', monospace;
  font-size:21px; font-weight:600; letter-spacing:0.05em;
  color:var(--teal);
}
.ask .ask-q{
  font-size:31px; line-height:1.5; font-weight:600; color:var(--ink);
  max-width:820px; word-break:keep-all;
}

.follow-card{
  display:flex; align-items:center; gap:20px;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px 24px;
  width:100%;
}
.avatar{
  width:60px; height:60px; border-radius:50%;
  background:radial-gradient(circle at 40% 35%, var(--avatar-a), var(--avatar-b));
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.avatar svg{ display:block; }
.follow-info{ flex:1; display:flex; flex-direction:column; gap:3px; text-align:left; }
.follow-handle{ font-family:'IBM Plex Mono', monospace; font-size:25px; font-weight:600; color:var(--ink); }
.follow-sub{ font-size:18px; color:var(--muted); }
.follow-btn{
  font-family:'Noto Sans KR', sans-serif;
  font-size:22px; font-weight:700;
  background:var(--amber);
  color:#1a1204;
  padding:12px 26px;
  border-radius:10px;
  flex-shrink:0;
}
.bottom-row{ display:flex; justify-content:space-between; align-items:center; }
.cadence{ font-family:'IBM Plex Mono', monospace; font-size:22px; color:var(--muted); }
</style>
</head>
<body>
  <div class="frame">
    <div class="top-row">
      <span class="eyebrow mono" style="color:var(--muted); font-size:24px;">DAILY BRIEF · ECONOMY &amp; TECH</span>
      <span class="date mono" style="color:var(--muted); font-size:24px;">__DATE__</span>
    </div>

    <div class="center-block">
      <h2><span class="accent">저장</span>해두고<br>퇴근길에 다시 보세요</h2>
      <div class="cta">매일 아침 8시 미국장, 저녁 6시 국내 이슈. 5분이면 오늘 경제·IT가 정리돼요.</div>

      <div class="ask">
        <span class="ask-label">여러분 생각은?</span>
        <span class="ask-q">__QUESTION__</span>
      </div>

      <div class="follow-card">
        <div class="avatar">
          <svg width="32" height="32" viewBox="0 0 34 34">
            <rect x="4" y="18" width="6" height="12" rx="2" fill="#e8a33d"/>
            <rect x="14" y="12" width="6" height="18" rx="2" fill="#e8a33d"/>
            <rect x="24" y="6" width="6" height="24" rx="2" fill="#e8a33d"/>
          </svg>
        </div>
        <div class="follow-info">
          <span class="follow-handle">@__HANDLE__</span>
          <span class="follow-sub">경제·재테크·IT 데일리 브리핑</span>
        </div>
        <div class="follow-btn">+ 팔로우</div>
      </div>
    </div>

    <div class="rule"></div>
    <div class="bottom-row" style="padding-top:22px;">
      <span class="handle">@__HANDLE__</span>
      <span class="cadence">08:00 · 18:00 업데이트</span>
    </div>
  </div>
</body>
</html>
